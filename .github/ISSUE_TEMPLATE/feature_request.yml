name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who is it for, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, I'd like to open a PR"
        - "Yes, with some guidance"
        - "No, just suggesting"
