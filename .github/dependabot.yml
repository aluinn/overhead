version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      react-next:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      three:
        patterns: ["three", "@types/three"]
      test-tooling:
        patterns: ["vitest", "@playwright/test"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
